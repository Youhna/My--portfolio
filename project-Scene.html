<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Name | Detail</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Space+Grotesk:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* ===== 相册核心样式 ===== */
      .gallery-wrapper {
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        overflow: hidden;
      }

      /* 图片轨道 */
      .gallery-track {
        display: flex;
        transition: transform 0.55s cubic-bezier(0.77, 0, 0.18, 1);
        will-change: transform;
      }

      .gallery-track img {
        width: 100%;
        flex-shrink: 0;
        object-fit: contain;
        max-height: 78vh;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* 箭头按钮 */
      .gallery-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.12);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      }

      .gallery-btn:hover {
        background: #000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.18);
        transform: translateY(-50%) scale(1.08);
      }

      .gallery-btn:hover svg {
        stroke: #fff;
      }

      .gallery-btn svg {
        stroke: #000;
        transition: stroke 0.2s ease;
      }

      .gallery-btn-prev { left: 16px; }
      .gallery-btn-next { right: 16px; }

      /* 点状指示器 */
      .gallery-dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
      }

      .gallery-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ccc;
        cursor: pointer;
        transition: background 0.25s ease, transform 0.25s ease;
        border: none;
        padding: 0;
      }

      .gallery-dot.active {
        background: #000;
        transform: scale(1.4);
      }

      /* 计数器 */
      .gallery-counter {
        text-align: center;
        margin-top: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.78rem;
        font-weight: 300;
        letter-spacing: 0.12em;
        color: #999;
      }

      /* 键盘提示 */
      .gallery-hint {
        text-align: center;
        margin-top: 8px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.72rem;
        font-weight: 300;
        letter-spacing: 0.08em;
        color: #bbb;
      }
    </style>
  </head>

  <body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- 导航栏 -->
    <nav class="navbar">
      <div class="logo">YOUHAN's Art Space.</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html" style="border-bottom: 1px solid #000;">Work</a></li>
        <li><a href="index.html#about">About</a></li>
      </ul>
      <div class="burger">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
      </div>
    </nav>

    <!-- 作品详情容器 -->
    <div class="project-container reveal-up">

      <!-- 顶部标题 -->
      <div class="project-header">
        <h1>Scene</h1>
        <p class="meta">Category: AI/Image &nbsp;•&nbsp; Year: 2026</p>
      </div>

      <!-- ===== 相册区域 ===== -->
      <div class="project-media" style="padding: 0; background: transparent;">

        <div class="gallery-wrapper">

          <!-- 图片轨道，在这里添加你的图片 -->
          <div class="gallery-track" id="galleryTrack">
            <img src="assets/images/C-1.jpg" alt="Photo 1" />
            <img src="assets/images/C-2.jpg" alt="Photo 2" />
            <img src="assets/images/C-3.jpg" alt="Photo 3" />
            <img src="assets/images/C-4.jpg" alt="Photo 4" />
            <!-- 继续添加 img 标签即可，JS 自动适配数量 -->
          </div>

          <!-- 上一张 -->
          <button class="gallery-btn gallery-btn-prev" id="btnPrev" aria-label="Previous image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <!-- 下一张 -->
          <button class="gallery-btn gallery-btn-next" id="btnNext" aria-label="Next image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

        </div>

        <!-- 点状指示器（自动生成） -->
        <div class="gallery-dots" id="galleryDots"></div>

        <!-- 数字计数 -->
        <div class="gallery-counter" id="galleryCounter"></div>

        <!-- 键盘提示 -->
        <div class="gallery-hint">Use arrow keys to navigate</div>

      </div>

      <!-- 底部返回 -->
      <div class="next-project" style="margin-top: 4rem; text-align: center;">
            <a href="work.html">← Back to All Works</a>
        </div>

    </div>

    <!-- ============================
         3. 页脚
         ============================ -->
    <footer class="footer">
      <p>&copy; 2025 YOUHAN Art Space. All Rights Reserved.</p>
    </footer>

    <!-- 脚本 -->
    <script src="script.js"></script>

    <script>
      /* ===== 相册逻辑 ===== */
      (function () {
        const track   = document.getElementById('galleryTrack');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const dotsEl  = document.getElementById('galleryDots');
        const counter = document.getElementById('galleryCounter');

        const images = track.querySelectorAll('img');
        const total  = images.length;
        let   current = 0;

        /* 生成点状指示器 */
        images.forEach(function (_, i) {
          const dot = document.createElement('button');
          dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
          dot.setAttribute('aria-label', 'Go to image ' + (i + 1));
          dot.addEventListener('click', function () { goTo(i); });
          dotsEl.appendChild(dot);
        });

        function updateUI() {
          /* 移动轨道 */
          track.style.transform = 'translateX(-' + current * 100 + '%)';

          /* 更新点 */
          const dots = dotsEl.querySelectorAll('.gallery-dot');
          dots.forEach(function (d, i) {
            d.classList.toggle('active', i === current);
          });

          /* 更新计数 */
          counter.textContent = (current + 1) + ' / ' + total;

          /* 禁用边界按钮（可选，注释掉则循环） */
          btnPrev.style.opacity = current === 0 ? '0.3' : '1';
          btnNext.style.opacity = current === total - 1 ? '0.3' : '1';
        }

        function goTo(index) {
          current = Math.max(0, Math.min(index, total - 1));
          updateUI();
        }

        btnPrev.addEventListener('click', function () {
          if (current > 0) goTo(current - 1);
        });

        btnNext.addEventListener('click', function () {
          if (current < total - 1) goTo(current + 1);
        });

        /* 键盘方向键支持 */
        document.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft')  { if (current > 0) goTo(current - 1); }
          if (e.key === 'ArrowRight') { if (current < total - 1) goTo(current + 1); }
        });

        /* 触摸滑动支持（手机端） */
        var touchStartX = 0;
        track.addEventListener('touchstart', function (e) {
          touchStartX = e.touches[0].clientX;
        }, { passive: true });
        track.addEventListener('touchend', function (e) {
          var diff = touchStartX - e.changedTouches[0].clientX;
          if (Math.abs(diff) > 40) {
            if (diff > 0 && current < total - 1) goTo(current + 1);
            if (diff < 0 && current > 0) goTo(current - 1);
          }
        }, { passive: true });

        /* 初始化 */
        updateUI();
      })();
    </script>
  </body>
</html>
